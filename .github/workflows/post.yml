
name: Segunda Bola - Auto Post

on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: segunda-bola-publicacao
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuracoes
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys

          obrigatorias = [
              "GEMINI_KEY",
              "BLOG_ID",
              "BLOGGER_CLIENT_ID",
              "BLOGGER_CLIENT_SECRET",
              "BLOGGER_REFRESH_TOKEN"
          ]

          faltando = [
              nome for nome in obrigatorias
              if not os.environ.get(nome)
          ]

          if faltando:
              print("ERRO: Secrets em falta:")
              for nome in faltando:
                  print("- " + nome)
              sys.exit(1)

          print("Todas as configuracoes obrigatorias foram encontradas.")
          PY

      - name: Publicar noticia
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

        run: python main.py
