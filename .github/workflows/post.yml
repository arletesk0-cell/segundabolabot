
name: Segunda Bola - Auto Post

on:
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar configuracoes
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          obrigatorias = [
              "GEMINI_KEY",
              "BLOG_ID",
              "BLOGGER_CLIENT_ID",
              "BLOGGER_CLIENT_SECRET",
              "BLOGGER_REFRESH_TOKEN"
          ]

          faltam = [
              nome for nome in obrigatorias
              if not os.environ.get(nome)
          ]

          if faltam:
              raise SystemExit(
                  "Secrets em falta: " + ", ".join(faltam)
              )

          print("Configuracoes obrigatorias verificadas.")
          PY

      - name: Publicar noticia
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}

          BLOG_ID: ${{ secrets.BLOG_ID }}

          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}

          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}

          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}

          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

        run: python main.py
